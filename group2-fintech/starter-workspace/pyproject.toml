[project]
name = "swiftkyc"
version = "0.1.0"
description = "SwiftKYC - digital onboarding & e-KYC API (Metro Finance)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "T20", "RUF"]
# S = flake8-bandit: the Security extension makes these findings, not suggestions.
ignore = ["S101"]  # assert is fine inside tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
# scripts/ holds command-line diagnostics: printing is their whole job, and catching
# anything at all is deliberate so the operator gets a readable message instead of a
# traceback. Neither applies to the service itself.
"scripts/*" = ["T20", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
